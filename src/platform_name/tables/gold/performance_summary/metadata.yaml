name: performance_summary

layer: gold

execution:
  mode: pandas

load:
  strategy: full

dependencies:
  - gold.returns

description: >
  Summary performance statistics (mean/volatility/count) per security,
  derived from daily returns.

processor:
  module: platform_name.tables.gold.performance_summary.processor
  class: PerformanceSummaryProcessor

paths:
  input:
    file: returns.parquet
    root: gold
    parameter: returns_path

  output:
    file: performance_summary.parquet

processor_config: {}

# Local dev environment with PySpark + DuckDB pre-installed. Not part of
# the deployment path (see docs/DEPLOYMENT.md) -- this is purely a
# convenience for running/testing execution.mode: pyspark and
# execution.mode: sql tables locally without installing a JVM yourself.
#
# Usage:
#   docker compose build
#   docker compose run --rm dev bash              # interactive shell
#   docker compose run --rm dev pytest             # full test suite
#   docker compose run --rm dev python scripts/local_dev_pipeline.py
services:
  dev:
    build: .
    volumes:
      # Live-mount the repo so code edits on the host are picked up
      # immediately -- no image rebuild needed for a normal edit/test loop.
      # The venv/editable-install metadata created at build time still
      # lives inside the image layer, only source files are overlaid.
      - .:/app
    working_dir: /app
    environment:
      PYTHONPATH: /app/src
    stdin_open: true
    tty: true
